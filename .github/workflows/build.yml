name: Build LGL Menu

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Patch Overlay Window Type for Android 8+
        run: |
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/TYPE_PHONE/TYPE_APPLICATION_OVERLAY/g' {} +
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/TYPE_SYSTEM_ALERT/TYPE_APPLICATION_OVERLAY/g' {} +
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/2002/2038/g' {} +
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/2003/2038/g' {} +

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LGL-ModMenu-APK
          path: app/build/outputs/apk/debug/*.apk
