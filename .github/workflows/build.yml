name: Build LGL Menu
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      # This step automatically fixes the overlay token crash across all source files
      - name: Patch Overlay Window Type for Android 8+
        run: |
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/TYPE_PHONE/TYPE_APPLICATION_OVERLAY/g' {} +
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/TYPE_SYSTEM_ALERT/TYPE_APPLICATION_OVERLAY/g' {} +
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/2002/2038/g' {} +
          find app/src/ -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/2003/2038/g' {} +

      - name: Compila APK Diretto
        run: gradle assembleDebug --no-daemon

      - name: Salva APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: LGL-ModMenu-APK
          path: app/build/outputs/apk/debug/*.apk
